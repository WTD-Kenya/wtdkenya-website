name: Sync to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config --global user.email "jumalawrence98@gmail.com"
          git config --global user.name "Jumalaw98"

      - name: Add GitLab remote
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/jumalaw98/wtd-web.git

      - name: Remove all files from main branch
        run: |
          git rm -r --ignore-unmatch *
          git commit -am "Clean main branch before sync" || echo "Nothing to commit"

      - name: Pull from GitLab (accept theirs)
        run: |
          git pull -s recursive -X theirs gitlab main

      - name: Push to GitLab safely
        run: |
          git push gitlab main
