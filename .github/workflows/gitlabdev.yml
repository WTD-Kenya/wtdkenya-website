name: Sync GitHub dev to GitLab main

on:
  push:
    branches:
      - dev

jobs:
  sync:
    runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Git identity
    run: |
      git config --global user.email "jumalawrence98@gmail.com"
      git config --global user.name "Jumalaw98"

  - name: Add GitLab remote
    run: |
      git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/jumalaw98/wtdkenya-website.git

  - name: Pull latest from GitLab main
    run: git pull --rebase gitlab main

  - name: Push dev to GitLab main (without force)
    run: git push gitlab HEAD:main
